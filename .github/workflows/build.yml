name: Build
run-name: ${{ inputs.release_tag != '' && format('Release {0}', inputs.release_tag) || format('Build {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version to release as a draft, e.g. 0.1.0 (must match pubspec.yaml); omit for Actions artifacts only
        default: ""
        type: string
      build_android:
        description: Build Android
        default: true
        type: boolean
      build_ios:
        description: Build iOS
        default: true
        type: boolean
      build_macos:
        description: Build macOS
        default: true
        type: boolean
      build_windows:
        description: Build Windows
        default: true
        type: boolean
      build_linux:
        description: Build Linux
        default: true
        type: boolean

env:
  FLUTTER_VERSION: "3.47.1"
  BUN_VERSION: "1.4.0"
  # Flutter's Linux toolchain plus libsecret for flutter_secure_storage_linux; the other plugins need only GTK 3.
  LINUX_APT_PACKAGES: clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

jobs:
  name:
    name: Name artifacts and check the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.short }}
    steps:
      - name: Short commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.release_tag != '' }}
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Before any build starts, so a release that could not be published fails in seconds rather than after the
      # macOS and iOS builds.
      - name: Check the release
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALL_PLATFORMS: ${{ inputs.build_android && inputs.build_ios && inputs.build_macos && inputs.build_windows && inputs.build_linux }}
          MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() {
            echo "::error title=Release not started::$1"
            exit 1
          }
          [ "$GITHUB_REF" = refs/heads/main ] || fail "Releases are built from main, not $GITHUB_REF."
          [ "$ALL_PLATFORMS" = true ] || fail "A release needs all five platforms: select every build input."
          [ "$MACOS_SIGNING" = true ] || fail "A release ships a signed, notarized DMG: set the six signing secrets (README, Releasing)."
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          [ "$RELEASE_TAG" = "$version" ] || fail "The release tag $RELEASE_TAG is not pubspec.yaml's version $version."
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            fail "The tag $RELEASE_TAG already exists."
          fi

  build-android:
    name: Build Android
    needs: name
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ARTIFACT: ompanion-android-${{ needs.name.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build the companion
        run: scripts/build_companion.sh

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # No signing secrets: the release build type signs with the template's debug key
      # (android/app/build.gradle.kts), so the APK installs for testing but is not a store build.
      - name: Build APK
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ompanion-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ompanion-android.apk
          if-no-files-found: error
          compression-level: 0

  build-ios:
    name: Build iOS
    needs: name
    if: ${{ inputs.build_ios }}
    # Xcode 26 or newer: the app icons are Icon Composer .icon bundles.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ARTIFACT: ompanion-ios-${{ needs.name.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Build the companion
        run: scripts/build_companion.sh

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      # An .ipa is the app in a Payload folder, zipped. Unsigned: sideloading tools sign it for the device. ditto
      # keeps the bundle's symlinks and permissions.
      - name: Package the IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" ompanion-ios.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ompanion-ios.ipa
          if-no-files-found: error
          compression-level: 0

  build-macos:
    name: Build macOS
    needs: name
    if: ${{ inputs.build_macos }}
    # Xcode 26 or newer: the app icons are Icon Composer .icon bundles.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ARTIFACT: ompanion-macos-${{ needs.name.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Build the companion
        run: scripts/build_companion.sh

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build macOS
        run: flutter build macos --release

      # All six are needed together: a certificate without notary credentials, or the other way round,
      # cannot ship a DMG Gatekeeper accepts. None of them means a fork or a checkout before the
      # maintainer adds them: build an unsigned DMG rather than fail (README, Releasing).
      - name: Check the signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=
          present=0
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              present=$((present + 1))
            else
              missing="$missing $name"
            fi
          done

          if [ "$present" -eq 6 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$present" -eq 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned macOS build::No signing secrets are set, so ompanion-macos.dmg holds an unsigned app that Gatekeeper rejects on another Mac."
          else
            echo "Signing is half set up, missing:$missing" >&2
            echo "Set all six or none: the job signs, notarizes and staples only when every secret is there." >&2
            exit 1
          fi

      - name: Import the signing certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # The p12 is the exported Developer ID Application certificate and its private key. $GITHUB_ENV reaches
          # only later steps (the keychain cleanup), so this step uses its own copies of the paths. They are written
          # there first, so a failure below still deletes the keychain.
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # `base64 --decode -o` is not in every coreutils on PATH; decoding to stdout works in all of them.
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          # -T lets codesign use the key without asking; the partition list opens it to a session with no UI
          # to answer a prompt in.
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # codesign searches the keychains in this list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Sign the app
        if: steps.signing.outputs.signed == 'true'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | grep -o '".*"' | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "The imported certificate holds no Developer ID Application identity:" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2
            exit 1
          fi
          echo "Signing with $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Inside-out with hardened runtime; the same script signs the local ad-hoc release build.
          scripts/sign_app.sh "$IDENTITY" build/macos/Build/Products/Release/ompanion.app \
            macos/Runner/Release.entitlements

      - name: Verify the signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          APP=build/macos/Build/Products/Release/ompanion.app
          codesign -dvvv "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/entitlements.plist"
          /usr/libexec/PlistBuddy -c Print "$RUNNER_TEMP/entitlements.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize the app
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP=build/macos/Build/Products/Release/ompanion.app
          # notarytool takes a .zip, a .dmg or a .pkg; ditto keeps the symlinks and permissions of the bundle.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/ompanion.zip"
          scripts/notarize.sh "$RUNNER_TEMP/ompanion.zip" "$RUNNER_TEMP"

          # Only the stapled ticket makes Gatekeeper accept a Developer ID app.
          spctl -a -vv "$APP"

      - name: Create the DMG
        run: |
          # What the user drags into /Applications: the app and a link to that folder.
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R build/macos/Build/Products/Release/ompanion.app "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -format ULMO -srcfolder "$RUNNER_TEMP/dmg" -volname ompanion ompanion-macos.dmg

      - name: Sign the DMG
        if: steps.signing.outputs.signed == 'true'
        run: |
          # A disk image is signed, not hardened: --options runtime and entitlements apply to code.
          codesign --force --sign "$IDENTITY" --timestamp ompanion-macos.dmg
          codesign --verify --strict --verbose=2 ompanion-macos.dmg

      - name: Notarize the DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/notarize.sh ompanion-macos.dmg "$RUNNER_TEMP"

          # The app bundle inside was checked before packaging; this is the artifact the user downloads.
          spctl -a -t open --context context:primary-signature -v ompanion-macos.dmg

      - name: Delete the temporary keychain
        if: ${{ always() && steps.signing.outputs.signed == 'true' }}
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH"; fi
          rm -f "$CERTIFICATE_PATH"

      - name: Upload the DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ompanion-macos.dmg
          if-no-files-found: error
          compression-level: 0

  build-windows:
    name: Build Windows
    needs: name
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ARTIFACT: ompanion-windows-${{ needs.name.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Build the companion
        shell: bash
        run: scripts/build_companion.sh

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip the Release folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ompanion-windows-x64.zip

      - name: Upload the zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ompanion-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  build-linux:
    name: Build Linux
    needs: name
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ARTIFACT: ompanion-linux-${{ needs.name.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # one package per word
          sudo apt-get install -y --no-install-recommends $LINUX_APT_PACKAGES

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Build the companion
        run: scripts/build_companion.sh

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux
        run: flutter build linux --release

      # zip keeps the executable bits, which the artifact zip would drop.
      - name: Zip the bundle
        working-directory: build/linux/x64/release/bundle
        run: zip -qr "$GITHUB_WORKSPACE/ompanion-linux-x64.zip" .

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ompanion-linux-x64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Draft the release
    needs: [name, build-android, build-ios, build-macos, build-windows, build-linux]
    # Runs only when every build succeeded; "Check the release" made sure all five were selected.
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download the builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ompanion-*-${{ needs.name.outputs.sha }}
          path: release
          merge-multiple: true

      # A draft holds no tag yet: publishing it creates the tag on the commit that was built.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          count=$(find release -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "::error::Expected the five platform files, found $count." >&2
            exit 1
          fi
          # Drafts are visible only to a token that can write, so this check lives here, not before the builds.
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release named $RELEASE_TAG already exists: delete it or release the next version." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* -R "$GITHUB_REPOSITORY" \
            --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG"
