name: CI

on:
  push:
    branches:
      - main
  # Keep untrusted code on the read-only pull_request event. Never use pull_request_target here.
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The page bundles the companion (ui/companion/ompx.js, gitignored).
      - name: Build the companion
        working-directory: .
        run: scripts/build_companion.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # src/app/i18n/strings.g.ts, the strings' generated types, matches en.i18n.json.
      - name: Check the strings
        run: bun scripts/i18n.ts --check

      - name: Typecheck
        run: bun run typecheck

      # The run log pump's tests (src/core/channel/log_script.test.ts) run log.js with the omp release binary as Bun.
      - name: Fetch omp
        working-directory: .
        run: scripts/fetch_omp.sh linux-x64

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  core:
    name: Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  release-script:
    name: Release script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The release pipeline's tests need only the standard library, so the runner's Python runs them.
      - name: Test the release script
        run: python3 scripts/release/test_deploy.py

  companion:
    name: Companion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: companion
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

  relay:
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The image the VPS runs (relay/README.md); building it checks the Dockerfile and the lockfile.
      - name: Build the image
        run: docker build --tag ompanion-push-relay .

  integration:
    name: Integration (omp ${{ matrix.omp }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # The tested omp (harness/omp-version, what every other run uses) and the oldest one the app drives
    # (minimumOmpVersion): a companion that works on one can fail on the other.
    strategy:
      fail-fast: false
      matrix:
        omp: [tested, minimum]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Every later step, the scripts and the tests read OMP_VERSION.
      - name: Choose the omp version
        env:
          MATRIX_OMP: ${{ matrix.omp }}
        run: |
          if [ "$MATRIX_OMP" = minimum ]; then
            version=$(sed -n 's/^export const minimumOmpVersion = "\(.*\)";$/\1/p' ui/src/core/host/probe.ts)
          else
            version=$(tr -d '[:space:]' <harness/omp-version)
          fi
          [ -n "$version" ] || { echo "no omp version for $MATRIX_OMP" >&2; exit 1; }
          echo "OMP_VERSION=$version" >>"$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The tests build the core's dev bridge (core/cmd/devbridge) and talk to it.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # OpenSSH's server for harness/studio-sshd.sh, which the SSH tests start as this user on loopback ports. csh
      # stands in for a login shell that misreads sh quoting in the PowerShell 7 group (the runner ships pwsh). The
      # image tests make previews with ffmpeg, and with CI set they fail rather than skip without it.
      - name: Install OpenSSH server, csh and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server csh ffmpeg

      - name: Fetch omp
        run: scripts/fetch_omp.sh linux-x64

      - name: Build the companion
        run: scripts/build_companion.sh

      - name: Install dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: End-to-end tests
        working-directory: ui
        run: bun run test:e2e

  # The Windows machine support end to end: this runner's own Win32-OpenSSH server, reached with key authentication
  # through the core's SSH client over its dev bridge, runs the UI's Windows host e2e tests with the tested omp and the
  # fake provider.
  windows-host:
    name: Windows host (Win32-OpenSSH)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The image ships Win32-OpenSSH's server stopped. The runner user is an administrator, so sshd reads its key from
      # administrators_authorized_keys, which must be writable by Administrators and SYSTEM only.
      - name: Start sshd with key authentication for the runner user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ssh = "$env:SystemRoot\System32\OpenSSH"
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }
          $key = Join-Path $env:RUNNER_TEMP 'ompanion_key'
          & "$ssh\ssh-keygen.exe" -q -t ed25519 -N '' -f $key
          $auth = "$env:ProgramData\ssh\administrators_authorized_keys"
          Get-Content "$key.pub" | Set-Content -Encoding ascii $auth
          icacls.exe $auth /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          Start-Service sshd
          $known = Join-Path $env:RUNNER_TEMP 'known_hosts'
          & "$ssh\ssh-keyscan.exe" -t ed25519 localhost 2>$null | Set-Content -Encoding ascii $known
          & "$ssh\sshd.exe" -V
          "OMPANION_WINDOWS_SSH_KEY=$key" >> $env:GITHUB_ENV
          "OMPANION_WINDOWS_KNOWN_HOSTS=$known" >> $env:GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The tests build the core's dev bridge (core/cmd/devbridge) and talk to it.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Fetch omp
        run: scripts/fetch_omp.sh windows-x64

      # The image test makes a preview with ffmpeg, which the image lacks; Chocolatey's shim directory is on the machine
      # PATH that SSH sessions get.
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      # The session tests upload ui/companion/ompx.js.
      - name: Build the companion
        run: scripts/build_companion.sh

      - name: Install dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      # Git Bash puts Git for Windows' sh on PATH, which the tests use for harness/omp-home.sh.
      - name: Windows host tests
        working-directory: ui
        run: bun test --conditions=browser --timeout=60000 ./src/core/host/windows_host.e2e.test.ts ./src/core/session/windows_session.e2e.test.ts

  apple:
    name: Apple shell
    # Xcode 26 or newer: the app icon is an Icon Composer .icon bundle.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # gomobile at the version core/go.mod pins; core/scripts/bind-apple.sh finds it in $(go env GOPATH)/bin.
      - name: Install XcodeGen and gomobile
        run: |
          brew install xcodegen
          cd core && go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind

      - name: Build the companion
        run: scripts/build_companion.sh

      - name: Build the UI
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build macOS and the iOS simulator
        run: shells/apple/build.sh --core

      # The device slice compiles what the simulator build does not: the notification service extension.
      - name: Build for iOS devices, unsigned
        run: shells/apple/build.sh --device

  android:
    name: Android shell
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('shells/android/**/*.gradle*', 'shells/android/gradle/wrapper/gradle-wrapper.properties') }}

      # gomobile at the version core/go.mod pins; core/scripts/bind-android.sh finds it in $(go env GOPATH)/bin and
      # the runner's NDK through ANDROID_NDK_HOME.
      - name: Install gomobile
        working-directory: core
        run: go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind

      - name: Build the companion and install the page's dependencies
        run: |
          scripts/build_companion.sh
          cd ui && bun install --frozen-lockfile

      # The direct APKs and the play bundle, signed with the debug key (no key.properties here).
      - name: Build the release APKs and the Play bundle
        run: shells/android/build.sh --release

      - name: Unit tests
        working-directory: shells/android
        run: ./gradlew testDebugUnitTest

  linux:
    name: Linux shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The whole history: the Flutter seed builds from the last Flutter commit (harness/flutter-seed/build.sh).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The app's libraries for the run on the runner and shells/linux/ci.sh's tools (Xvfb, a keyring, xdotool,
      # xclip); the Flutter seed's build tools; Flatpak.
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libwebkitgtk-6.0-4 libsecret-1-0 bubblewrap xdg-dbus-proxy \
            xvfb xauth dbus gnome-keyring libsecret-tools xdotool xclip python3-gi gir1.2-gtk-3.0 x11-apps netpbm zip \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            flatpak flatpak-builder

      # Ubuntu 24.04 keeps unprivileged user namespaces from programs without an AppArmor profile, which WebKit's
      # bubblewrap sandbox and Flatpak's portal need.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The Flutter app's last release toolchain, for the seed that writes the data the import reads.
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.47.1"
          cache: true

      - name: Build the UI
        run: |
          scripts/build_companion.sh
          cd ui
          bun install --frozen-lockfile
          bun run build

      - name: Build
        run: shells/linux/build.sh amd64

      # Its last line is the seed binary's path.
      - name: Build the Flutter seed
        run: harness/flutter-seed/build.sh linux | tee "$RUNNER_TEMP/seed-build.txt"

      - name: Build the Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          shells/linux/flatpak/build-flatpak.sh
          flatpak install --user --noninteractive build/ompanion-linux-x64.flatpak

      # The smoke checks on the runner and in the Flatpak, each after the Flutter seed's data was imported; ci.sh
      # runs its own session bus, keyring and Xvfb.
      - name: Smoke on the runner and in the Flatpak, with the Flutter import
        run: |
          shells/linux/ci.sh --seed "$(tail -n 1 "$RUNNER_TEMP/seed-build.txt")" --flatpak \
            build/linux-amd64 "$RUNNER_TEMP/smoke"

      - name: Upload the smoke logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-smoke
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore

  windows-build:
    name: Windows shell (cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the UI
        run: |
          scripts/build_companion.sh
          cd ui
          bun install --frozen-lockfile
          bun run build

      - name: JSON test
        run: |
          c++ -std=c++20 -Ishells/windows/src shells/windows/src/json.cpp shells/windows/test/json_test.cpp \
            -o "$RUNNER_TEMP/json_test"
          "$RUNNER_TEMP/json_test"

      # Cross-built with llvm-mingw in Docker.
      - name: Build
        run: shells/windows/build.sh x64 arm64

      - name: Upload the builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-build
          path: |
            build/windows-x64/
            build/windows-arm64/
          if-no-files-found: error
          retention-days: 1

  windows-x64:
    name: Windows x64
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # The whole history: the Flutter seed builds from the last Flutter commit (harness/flutter-seed/build.sh).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-build
          path: build

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # Local exec, ConPTY and the rest of the core on Windows itself.
      - name: Core tests
        working-directory: core
        run: go test ./...

      # The seed only changes with harness/flutter-seed; saved right after it is built, whatever the job's outcome.
      - name: Restore the Flutter seed
        id: seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/seed
          key: flutter-seed-windows-${{ hashFiles('harness/flutter-seed/**') }}

      - name: Setup Flutter
        if: steps.seed.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.47.1"

      - name: Build the Flutter seed
        if: steps.seed.outputs.cache-hit != 'true'
        run: harness/flutter-seed/build.sh windows --out "$(cygpath -u "$RUNNER_TEMP")/seed"

      - name: Save the Flutter seed
        if: steps.seed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/seed
          key: ${{ steps.seed.outputs.cache-primary-key }}

      # Windows PowerShell 5.1, whose WinRT projection reads the toast history. Every smoke check, the Flutter import
      # of the seed's data among them; prints "ci.ps1: every check passed".
      - name: Smoke, the zip's app
        shell: powershell
        run: shells\windows\ci.ps1 -App build\windows-x64 -Seed $env:RUNNER_TEMP\seed\Release

      - name: Pack the MSIX bundle and the zip
        shell: pwsh
        run: shells/windows/msix/build-msix.ps1

      - name: Smoke, the MSIX's app
        shell: powershell
        run: shells\windows\ci.ps1 -Bundle build\windows-package\ompanion-windows.msixbundle -Seed $env:RUNNER_TEMP\seed\Release

      - name: Upload the smoke logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64-logs
          path: build/windows-ci/
          if-no-files-found: warn

      # For the arm64 job.
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-package
          path: build/windows-package/
          if-no-files-found: error
          retention-days: 1

      - name: Upload the Flutter seed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flutter-seed-windows
          path: ${{ runner.temp }}/seed/
          if-no-files-found: error
          retention-days: 1

  windows-arm64:
    name: Windows arm64
    needs: windows-x64
    runs-on: windows-11-arm
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-build
          path: build

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-package
          path: build/windows-package

      # The x64 seed, emulated: it writes the same data an arm64 build would.
      - name: Download the Flutter seed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: flutter-seed-windows
          path: ${{ runner.temp }}/seed

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # The runner's gcc is x64-only, so cgo cannot build core/capi here; build.sh's llvm-mingw builds it for arm64
      # and the smoke runs use it.
      - name: Core tests
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # -NoDrop: on windows-11-arm a WWAHost window holds the front, so the harness cannot drag files onto the app;
      # only the drop is skipped (ci.ps1 prints "paths: drop skipped").
      - name: Smoke, the zip's app
        shell: powershell
        run: shells\windows\ci.ps1 -App build\windows-arm64 -Seed $env:RUNNER_TEMP\seed\Release -NoDrop

      - name: Smoke, the MSIX's app
        shell: powershell
        run: shells\windows\ci.ps1 -Bundle build\windows-package\ompanion-windows.msixbundle -Seed $env:RUNNER_TEMP\seed\Release -NoDrop

      - name: Upload the smoke logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-arm64-logs
          path: build/windows-ci/
          if-no-files-found: warn
