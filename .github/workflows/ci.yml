name: CI

on:
  push:
    branches:
      - main
  # Keep untrusted code on the read-only pull_request event. Never use pull_request_target here.
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"
  BUN_VERSION: "1.4.0"

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      # The app bundles the companion; without assets/companion/ompx.js no Flutter build or test runs.
      - name: Build the companion
        run: scripts/build_companion.sh

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Drift's generated output is not `dart format` clean and regenerating it would fight this step, so
      # *.g.dart and the drift migration schemas are excluded.
      - name: Check Dart formatting
        run: |
          git ls-files '*.dart' |
            grep -v -e '\.g\.dart$' -e '^test/drift/.*/generated/' -e '^packages/' -e '^companion/' -e '^harness/' |
            xargs -r dart format --output=none --set-exit-if-changed

      - name: Verify generated files are committed
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            printf 'Generated files not committed:\n%s\n' "$untracked" >&2
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      # flutter test includes test/sessions/sessions_provider_omp_test.dart, which starts this computer's omp.
      - name: Fetch omp
        run: scripts/fetch_omp.sh linux-x64

      - name: Test
        run: flutter test

  core:
    name: omp_core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/omp_core
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      # The runner ships pwsh, so windows_scripts_test.dart runs its PowerShell 7 group, where csh stands in for a
      # login shell that misreads sh quoting. Ubuntu has no csh by default.
      - name: Install csh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends csh

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      - name: Check Dart formatting
        run: git ls-files '*.dart' | xargs -r dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: dart analyze

      # Tests tagged omp or docker stay skipped here (dart_test.yaml); the integration job runs them.
      - name: Test
        run: dart test

  companion:
    name: Companion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: companion
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

  relay:
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The image the VPS runs (relay/README.md); building it checks the Dockerfile and the lockfile.
      - name: Build the image
        run: docker build --tag ompanion-push-relay .

  integration:
    name: Integration (omp and Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      # The runner and Docker's server are both x64: one binary serves the host and the SSH test machines.
      - name: Fetch omp
        run: scripts/fetch_omp.sh linux-x64

      # The session tests upload companion/dist/ompx.js.
      - name: Build the companion
        run: scripts/build_companion.sh

      - name: Start the SSH test machines
        run: harness/sshd/up.sh

      # -P integration runs the whole suite, so the PowerShell group needs csh here too (see the core job).
      - name: Install csh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends csh

      # The ffmpeg-tagged tests make image previews with this computer's ffmpeg; the ubuntu-24.04 runner image has
      # none, and without it they fail rather than skip. Ubuntu's build encodes WebP, so CI covers the WebP preview.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install omp_core dependencies
        working-directory: packages/omp_core
        run: dart pub get --enforce-lockfile

      # One file at a time: two Docker test files race on the target's shared run directory.
      - name: omp_core integration tests
        working-directory: packages/omp_core
        run: dart test -P integration -j 1

      - name: Companion end-to-end tests
        working-directory: companion
        run: bun run test:e2e

      - name: Stop the SSH test machines
        if: always()
        run: harness/sshd/down.sh

  # The Windows machine support end to end: this runner's own Win32-OpenSSH server, reached over dartssh2 with key
  # authentication, runs the omp_core tests tagged windows (test/windows/) with the pinned omp and the fake provider.
  windows-host:
    name: Windows host (Win32-OpenSSH)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The image ships Win32-OpenSSH's server stopped. The runner user is an administrator, so sshd reads its key from
      # administrators_authorized_keys, which must be writable by Administrators and SYSTEM only.
      - name: Start sshd with key authentication for the runner user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ssh = "$env:SystemRoot\System32\OpenSSH"
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }
          $key = Join-Path $env:RUNNER_TEMP 'ompanion_key'
          & "$ssh\ssh-keygen.exe" -q -t ed25519 -N '' -f $key
          $auth = "$env:ProgramData\ssh\administrators_authorized_keys"
          Get-Content "$key.pub" | Set-Content -Encoding ascii $auth
          icacls.exe $auth /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          Start-Service sshd
          $known = Join-Path $env:RUNNER_TEMP 'known_hosts'
          & "$ssh\ssh-keyscan.exe" -t ed25519 localhost 2>$null | Set-Content -Encoding ascii $known
          & "$ssh\sshd.exe" -V
          "OMPANION_WINDOWS_SSH_KEY=$key" >> $env:GITHUB_ENV
          "OMPANION_WINDOWS_KNOWN_HOSTS=$known" >> $env:GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Fetch omp
        run: scripts/fetch_omp.sh windows-x64

      # The image test makes a preview with ffmpeg, which the image lacks; Chocolatey's shim directory is on the machine
      # PATH that SSH sessions get.
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      # The session tests upload companion/dist/ompx.js.
      - name: Build the companion
        run: scripts/build_companion.sh

      - name: Install omp_core dependencies
        working-directory: packages/omp_core
        run: dart pub get --enforce-lockfile

      # Git Bash puts Git for Windows' sh on PATH, which the tests use for harness/omp-home.sh.
      - name: Windows host tests
        working-directory: packages/omp_core
        run: dart test -P windows -j 1 test/windows
