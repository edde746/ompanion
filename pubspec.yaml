name: ompanion
description: Flutter client for omp, the oh-my-pi coding agent, on this computer and remote machines.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  omp_core:
    path: packages/omp_core
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  desktop_drop: ^0.8.4
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  logger: ^2.8.0
  package_info_plus: ^10.2.1
  pasteboard: ^0.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  window_manager: ^0.5.2
  gpt_markdown: ^1.3.0
  re_highlight: ^0.0.3
  re_editor: ^0.10.0
  xterm2: ^5.2.0
  flutter_pty2: ^2.0.0
  url_launcher: ^6.3.2
  yaml: ^3.1.3
  yaml_edit: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # The app mark the About section shows.
    - assets/ompanion.png
    # Built by scripts/build_companion.sh; a missing file fails the build on purpose.
    - assets/companion/ompx.js
