# The ompanion review demo: a throwaway SSH host that runs omp 18.3.1 against a fake model provider, so
# App Review and Google Play review can use the app end to end with no AI account, no API key and no
# cost. Run it on a throwaway VPS; store/review-demo/README.md has the whole procedure.
#
# Three services on one private network: `host` (OpenSSH + omp, the machine the reviewer adds),
# `firewall` (owns the host's network namespace: the published port and the egress rules) and `provider`
# (harness/fake-provider in --demo mode). Only the SSH port is published.
name: ompanion-review

services:
  firewall:
    build:
      context: ../..
      dockerfile: store/review-demo/Dockerfile.firewall
    image: ompanion-review-firewall
    restart: unless-stopped
    # tini as PID 1, so `sleep` stops on SIGTERM instead of waiting out Docker's stop timeout.
    init: true
    ports:
      # The one port that leaves the stack; REVIEW_SSH_PORT in .env moves it. Published on every address
      # of the VPS; REVIEW_SSH_BIND=127.0.0.1 keeps a local test run off the network.
      - "${REVIEW_SSH_BIND:+${REVIEW_SSH_BIND}:}${REVIEW_SSH_PORT:-22222}:2222"
    networks: [review]
    # Docker's DNS answers `provider` itself and forwards every other name to this server, from inside
    # the namespace, where firewall.sh rejects it (192.0.2.1 is a documentation address). Without it
    # Docker may forward from the VPS's own namespace, and DNS would be a channel out.
    dns: [192.0.2.1]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/run]
    mem_limit: 32m
    pids_limit: 16
    healthcheck:
      test: ["CMD", "test", "-f", "/run/egress-closed"]
      interval: 2s
      timeout: 2s
      retries: 15

  host:
    build:
      context: ../..
      dockerfile: store/review-demo/Dockerfile.host
      args:
        # setup.sh writes it into .env. The build fails when it is empty, so the stack never comes up
        # with a guessable password. A build argument stays in this machine's image and build history
        # (`docker history`), as readable as .env beside it: never push the image.
        REVIEW_PASSWORD: ${REVIEW_PASSWORD:-}
    image: ompanion-review-host
    restart: unless-stopped
    # The firewall's network namespace: the host has no network of its own, so it never runs without the
    # egress rules, and it has no capability to change them.
    network_mode: service:firewall
    environment:
      # Only to write the published port into the home's README for the reviewer's own reference.
      REVIEW_SSH_PORT: "${REVIEW_SSH_PORT:-22222}"
    volumes:
      # The reviewer's home, its sessions, the uploaded companion and the host keys. The stack's only
      # volume, and the only writable path: the image itself is mounted read-only.
      - review-data:/data
    # Unprivileged: no root (the image's user is `review`), no capabilities, no privilege escalation,
    # no host mount, and CPU, memory and process limits. Disk is not capped (README, "Limits").
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /run
      - /tmp
    mem_limit: 768m
    pids_limit: 512
    cpus: 1.0
    depends_on:
      firewall:
        condition: service_healthy
        # A restarted firewall is a new network namespace; the host has to join it again.
        restart: true
      provider:
        condition: service_healthy
    logging:
      # sshd logs every connection attempt (LogLevel VERBOSE) and an internet-facing port is scanned day
      # and night; Docker's default json-file log never rotates.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  provider:
    build:
      context: ../..
      dockerfile: store/review-demo/Dockerfile.provider
    image: ompanion-review-provider
    restart: unless-stopped
    # No `ports`: the fake provider answers only inside this network, so nothing but the host container
    # can reach it, and only the canned demo turns leave it.
    networks: [review]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    pids_limit: 128
    cpus: 0.5
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8787/v1/models').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  # One private network. `internal: true` would keep the host off the internet, but Docker publishes no
  # port for a container without a route off its network; firewall.sh closes that route instead. omp needs
  # no internet at runtime (the home's config turns off the release and marketplace checks).
  review:

volumes:
  review-data:
