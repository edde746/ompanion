# omp's config for the review demo's home. The base settings are the ones harness/omp-home.sh uses for
# isolated homes: no release or marketplace checks, no host side effects, no language servers. Every chat
# role is the demo's one model, so a new session needs no model choice and nothing falls back to a model
# the demo has no key for.
startup:
  checkUpdate: false
marketplace:
  autoUpdate: "off"
power:
  sleepPrevention: "off"
lsp:
  enabled: false
dev:
  autoqa: false
modelRoles:
  default: demo/z-ai/glm-5.3-flash
  smol: demo/z-ai/glm-5.3-flash
  slow: demo/z-ai/glm-5.3-flash
