# The review demo's only model: GLM 5.3 Flash through OpenRouter, on a key with a spending limit.
# provision.sh writes the key in place of @OPENROUTER_API_KEY@ (from store/review-demo/.env).
#
# A provider of its own rather than omp's built-in `openrouter`: the built-in one with a key would make every
# OpenRouter model selectable in the app's model picker, and a reviewer could pick an expensive one. This
# provider has one model, so the picker shows one model.
providers:
  demo:
    baseUrl: https://openrouter.ai/api/v1
    apiKey: "@OPENROUTER_API_KEY@"
    api: openai-completions
    headers:
      HTTP-Referer: https://ompanion.app
      X-Title: ompanion review demo
    compat:
      thinkingFormat: openrouter
      reasoningContentField: reasoning
    models:
      - id: z-ai/glm-5.3-flash
        name: GLM 5.3 Flash
        reasoning: true
        input: [text, image]
        # The model takes 1M tokens; omp compacts before this, which keeps a long review session cheap.
        contextWindow: 262144
        maxTokens: 16384
