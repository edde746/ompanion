apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api
          image: registry.internal/api-server:0.4.0
          ports:
            - containerPort: 8080
          env:
            - name: STORAGE_DIR
              value: /var/lib/api-server/objects
