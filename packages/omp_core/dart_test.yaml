tags:
  omp:
    description: Starts a real omp binary from .tools/ with an isolated HOME.
    skip: "integration test; run with -P integration or -t omp"
  docker:
    description: Needs Docker (colima) and the SSH test containers from testing/sshd.
    skip: "integration test; run with -P integration or -t docker"
  ffmpeg:
    description: Runs this computer's ffmpeg (PATH or Homebrew's directories); CI installs it for the integration job.
    skip: "integration test; run with -P integration or -t ffmpeg"

presets:
  integration:
    tags:
      omp:
        skip: false
      docker:
        skip: false
      ffmpeg:
        skip: false
