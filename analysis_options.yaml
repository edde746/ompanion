include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - test/drift/*/generated/**
    - build/**
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - windows/**
    # Separate packages with their own analysis options and tooling.
    - packages/**
    - companion/**
    - testing/**
    - web/**

linter:
  rules:
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    use_super_parameters: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    avoid_print: true

formatter:
  page_width: 120
